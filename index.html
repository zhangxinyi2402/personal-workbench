function allView(){const items=data.tasks.filter(t=>t.status==='active'&&(allMode==='all'||t.section==='inbox'||(!t.scheduledDate&&!t.repeat.enabled))).filter(t=>t.title.toLowerCase().includes(search.toLowerCase()));return `<div class="toolbar"><div class="segmented">${button('收集箱','all-mode','data-mode="inbox"',allMode==='inbox'?'selected':'')}${button('所有活跃内容','all-mode','data-mode="all"',allMode==='all'?'selected':'')}</div><form id="searchForm"><input name="query" aria-label="搜索任务" placeholder="搜索任务，回车查找" value="${esc(search)}"></form>${addButton()}</div><div class="notice">收集箱展示尚未归类或未安排日期的非重复任务。点「今天」后，可直接选择下方的「安排时间」。</div><section class="card">${listHTML(W.sortTasks(data,items))}</section>`}
function weekView(){const end=W.shift(weekStart,6),cal=data.settings.weekView==='calendar';return `<div class="toolbar"><div>${button('← 上周','week-step','data-offset="-7"')}${button('本周','week-reset')}${button('下周 →','week-step','data-offset="7"')}</div><strong>${weekStart} — ${end}</strong><div class="segmented">${button('列表','week-view','data-mode="list"',!cal?'selected':'')}${button('日历','week-view','data-mode="calendar"',cal?'selected':'')}</div></div><div class="${cal?'week-scroll':''}"><div class="${cal?'week-grid':'week-list'}">${Array.from({length:7},(_,i)=>{const date=W.shift(weekStart,i),tasks=W.forDate(data,date);return `<section class="card week-day ${date===W.today()?'is-today':''}" data-drop-date="${date}" data-drop-block=""><div class="section-head"><div><h3>${['周一','周二','周三','周四','周五','周六','周日'][i]}${date===W.today()?' · 今天':''}</h3><span class="muted">${date.slice(5)} · ${tasks.length} 项</span></div>${addButton('＋',{scheduledDate:date})}</div>${tasks.map(t=>`<div class="week-task-wrap"><span class="muted">${esc(data.timeBlocks.find(b=>b.id===t.timeBlock)?.name||'待安排')}</span>${taskCard(t,date,cal)}</div>`).join('')||empty('留一点空间。')}</section>`}).join('')}</div></div>`}
function calendarView(){const first=month+'-01',offset=(W.weekday(first)+6)%7,start=W.shift(first,-offset);return `<div class="toolbar"><div>${button('← 上月','month-step','data-offset="-1"')}${button('本月','month-reset')}${button('下月 →','month-step','data-offset="1"')}</div><h2>${month.replace('-',' 年 ')} 月</h2></div><section class="card month-card"><div class="month-grid">${['一','二','三','四','五','六','日'].map(x=>`<div class="weekday">${x}</div>`).join('')}${Array.from({length:42},(_,i)=>{const date=W.shift(start,i),ts=p16DateTasks(date),done=ts.filter(t=>t.status==='completed').length,high=ts.filter(t=>t.priority==='high'&&t.status==='active').length,node=data.goals.some(g=>g.date===date&&g.status==='active')||data.tasks.some(t=>t.deadline===date&&t.status==='active'&&(t.countdown||t.priority==='high'));return `<button type="button" class="month-day ${date.slice(0,7)!==month?'outside':''} ${date===W.today()?'is-today':''} ${date===selectedDay?'selected':''}" data-action="select-day" data-date="${date}" aria-label="${date}，${ts.length} 项任务，完成 ${done}，高优先级 ${high}${node?'，重要节点':''}"><strong>${Number(date.slice(-2))}</strong>${ts.length?`<span>${ts.length} 项 <small>✓ ${done}</small></span>`:''}${high?`<small class="high-count">高 ${high}</small>`:''}${node?'<span class="node-dot" title="重要节点">◆</span>':''}</button>`}).join('')}</div></section><div class="section-head"><h2>${selectedDay} · 当日安排</h2>${addButton('＋ 添加任务',{scheduledDate:selectedDay})}</div>${dayView(selectedDay,true)}`}
function mainlinesView(){const lines=data.mainlines.filter(m=>m.status==='active');return `<div class="toolbar"><p class="muted">主线可以独立存在，也可以属于一个板块。</p>${button('＋ 新建主线','add-line','','primary')}</div><div class="mainline-grid">${lines.map(mainlineCard).join('')||empty('还没有进行中的主线。')}</div>`}
function sectionView(id){const s=data.sections.find(x=>x.id===id);if(!s)return empty('板块不存在');const lines=data.mainlines.filter(m=>m.section===id&&m.status==='active'),tasks=data.tasks.filter(t=>t.section===id&&t.status==='active'),done=W.completions(data).filter(t=>t.section===id);return `<div class="toolbar">${addButton('＋ 添加任务',{section:id})}${button('＋ 新建主线','add-line',`data-section="${id}"`)}</div>${lines.length?cardHead('当前主线')+'<div class="mainline-grid">'+lines.map(mainlineCard).join('')+'</div>':''}<section class="card">${cardHead('活跃任务',`<span class="muted">${tasks.length} 项</span>`)}${listHTML(W.sortTasks(data,tasks))}</section><section class="card"><h2>已完成摘要</h2><p>累计完成 ${done.length} 项${done.length?' · 最近：'+esc(done[0].title):''}</p></section>`}

function historyView(status){const tasks=status==='completed'?W.completions(data):data.tasks.filter(t=>t.status===status),lines=status==='archived'?data.mainlines.filter(m=>m.status==='archived'):[],sections=status==='archived'?data.sections.filter(s=>s.status==='archived'):[],goals=['archived','completed'].includes(status)?data.goals.filter(g=>g.status===status):[];return `${status==='trash'?`<div class="toolbar"><span class="muted">不会自动删除，到这里再做决定。</span>${button('清空垃圾桶','empty-trash','','danger')}</div>`:''}${status==='abandoned'?'<div class="notice">主动放弃是一种决策，不计作完成、失败或逾期。</div>':''}${lines.map(m=>`<section class="card"><h3>${esc(m.name)}</h3><span class="muted">已归档主线</span>${button('恢复主线','restore-line',`data-id="${m.id}"`)}</section>`).join('')}${goals.map(g=>`<section class="card"><h3>${esc(g.title)}</h3><span class="muted">${status==='archived'?'归档目标':'已完成目标'}</span> ${button('恢复目标','restore-goal',`data-id="${g.id}"`)}</section>`).join('')}${sections.map(s=>`<section class="card"><h3>${esc(s.name)}</h3><span class="muted">已归档板块</span>${button('恢复板块','p18-section-restore',`data-id="${s.id}"`)}</section>`).join('')}<section class="card">${cardHead(`${S[status]||'历史'} · ${tasks.length}`)}${listHTML(tasks)}</section>`}
function settingsView(){return `<section class="card"><h2>执行偏好</h2><label>全局快速添加默认日期<select data-setting="quickDefaultDate">${options([['none','不设置日期'],['today','今天'],['tomorrow','明天']],data.settings.quickDefaultDate)}</select></label><p class="muted">页面上下文优先：在今天添加就是今天，在板块添加就归属该板块。</p><label>完成后在 Today 的显示<select data-setting="completedVisibility">${options([['keepToday','当天保留完成态'],['hide','立即隐藏']],data.settings.completedVisibility)}</select></label></section><section class="card"><h2>备份与恢复</h2><p>离线使用，数据保存在此浏览器。跨设备、移动文件或更换浏览器前，请先备份。</p><div class="actions">${button('下载备份','backup','','primary')}${button('恢复备份','restore')}${button('导出旧版原始数据','legacy-backup')}${button('清空所有数据','clear','','danger')}</div><p class="muted">支持旧版 v1 备份迁移。新版损坏时不会用 Demo 覆盖原数据。</p></section><section class="card"><h2>前台核心架构</h2><p class="muted">板块、时间段与卡片布局存为配置数据。本轮不提供后台 Builder。演示内容不代表实际任务或习惯记录。</p></section>`}

function taskEditor(tid){const t=data.tasks.find(x=>x.id===tid);if(!t)return;draftTask=JSON.parse(JSON.stringify(t));openDialog('任务详情',`<form id="taskForm" data-id="${tid}">${input('任务名称','title',t.title,'text','required maxlength="300"')}<div class="fields"><label>所属板块<select name="section">${sectionOptions(t.section)}</select></label>${select('优先级','priority',Object.entries(P),t.priority)}${input('安排日期','scheduledDate',t.scheduledDate||'','date')}<label>时间段<select name="timeBlock">${slotOptions(t.timeBlock)}</select></label>${input('截止日期（截止日期）','deadline',t.deadline||'','date')}${select('关联目标（可选）','goalId',[['','无'],...data.goals.filter(g=>g.status==='active'||g.id===t.goalId).map(g=>[g.id,g.title])],t.goalId||'')}${select('状态（重复任务为整个系列）','status',Object.entries(S),t.status)}</div><fieldset><legend>关联主线 · 可多选</legend>${data.mainlines.filter(m=>m.status==='active'||t.linkedMainlines.includes(m.id)).map(m=>`<label class="check-inline"><input type="checkbox" name="linkedMainlines" value="${m.id}" ${t.linkedMainlines.includes(m.id)?'checked':''}>${esc(m.name)}</label>`).join('')||'<p class="muted">暂无主线，可以稍后创建。</p>'}</fieldset><label class="check-inline"><input type="checkbox" name="countdown" ${t.countdown?'checked':''}>独立开启倒计时（使用截止日期）</label><fieldset><legend>重复 / 习惯</legend><label class="check-inline"><input id="repeatEnabled" type="checkbox" name="repeatEnabled" ${t.repeat.enabled?'checked':''}>开启重复</label><div id="repeatFields" ${t.repeat.enabled?'':'hidden'}><p class="muted">重复任务只保存一个本体。按日期生成视图，完成状态逐日记录。</p><div class="fields">${select('重复规则','repeatRule',[['daily','每天'],['weekdays','工作日'],['weekly','每周指定日期'],['custom','自定义：每 N 天']],t.repeat.rule)}${input('开始日期','repeatStart',t.repeat.startDate,'date','required')}${input('自定义间隔（天）','interval',t.repeat.interval,'number','min="1" max="3650" step="1" required')}${input('每周目标次数','weeklyTarget',t.repeat.weeklyTarget,'number','min="1" max="100" step="1" required')}</div><div>每周指定日期</div>${[[1,'一'],[2,'二'],[3,'三'],[4,'四 function p17SortSection(items,mode='manual',direction='asc'){
 const stable=(a,b)=>(Number(a.manualOrder)||0)-(Number(b.manualOrder)||0)||String(a.id).localeCompare(String(b.id));
 // Global section/habit ordering uses the default task timeBlock, never an occurrence override.
 const blockOrder=new Map([...data.timeBlocks].map((b,index)=>({id:b.id,order:Number.isFinite(b.order)?b.order:index,index})).sort((a,b)=>a.order-b.order||a.index-b.index).map((b,index)=>[b.id,index]));
 const originals=new Map(data.tasks.map(t=>[t.id,t]));
 const blockRank=t=>{const source=t.contentType==='memo'?t:(originals.get(t.sourceId||t.id)||t);return blockOrder.get(source.timeBlock)};
 if(mode==='dailyTime'||mode==='dailyTimeAsc'||mode==='dailyTimeDesc')mode=mode==='dailyTimeDesc'||mode==='dailyTime'&&direction==='desc'?'timeDesc':'timeAsc';
 const compare=(a,b)=>{
  if(mode==='timeAsc'||mode==='timeDesc'){
   const at=blockRank(a),bt=blockRank(b);
   if(at===undefined||bt===undefined)return at!==undefined?-1:bt!==undefined?1:0;
   return (mode==='timeDesc'?-1:1)*(at-bt);
  }
  if(mode==='priorityAsc'||mode==='priorityDesc'){
   const rank=mode==='priorityAsc'?{low:0,medium:1,high:2}:{high:0,medium:1,low:2};return (rank[a.priority]??3)-(rank[b.priority]??3);
  }
  if(mode==='createdAsc'||mode==='createdDesc'){const d=String(a.createdAt||'').localeCompare(String(b.createdAt||''));return mode==='createdDesc'?-d:d}
  return 0;
 };

}
